  /api/admin/webhooks/dlq/{id}/replay:
    post:
      operationId: replayWebhookDlq
      tags:
        - Webhooks
      summary: Replay a dead-lettered webhook delivery (admin only)
      description: >-
        Re-enqueues a dead-lettered delivery as a fresh live delivery with `attempts = 0`. The original payload bytes
        and signature are preserved verbatim so the subscriber receives an identical signed request. Requires an admin
        JWT (`role: "admin"`).
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: UUID of the DLQ row to replay
          required: true
          description: UUID of the DLQ row to replay
          name: id
          in: path
      responses:
        '202':
          description: Replay accepted — a fresh live delivery has been enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deliveryId:
                        type: string
                        format: uuid
                        description: ID of the newly-created live delivery
                      status:
                        $ref: '#/components/schemas/DeliveryStatus'
                      attempts:
                        type: integer
                        minimum: 0
                        description: Always 0 for a freshly replayed delivery
                    required:
                      - deliveryId
                      - status
                      - attempts
                required:
                  - data
              examples:
                replayAccepted:
                  summary: Successful replay — new delivery created
                  value:
                    data:
                      deliveryId: ffff4444-dddd-4000-8000-000000000005
                      status: pending
                      attempts: 0
        '400':
          description: Malformed UUID in path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                badId:
                  summary: Non-UUID id parameter
                  value:
                    error:
                      code: bad_request
                      message: Invalid ID format
                      requestId: req-xyz-789
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Caller is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: DLQ row not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
              examples:
                notFound:
                  summary: No DLQ row with the given id
                  value:
                    error:
                      code: not_found
                      message: DLQ row not found
                      requestId: req-xyz-790
        '409':
          description: DLQ row already replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - already_replayed
                    required:
                      - type
                  replayDeliveryId:
                    type: string
                    nullable: true
                    format: uuid
required:
                      - error
                      - replayDeliveryId
                  examples:
                    alreadyReplayed:
                      summary: This DLQ row was already replayed — idempotency guard triggered
                      value:
                        error:
                          type: already_replayed
                        replayDeliveryId: ffff4444-dddd-4000-8000-000000000005

  /api/invites:
    post:
      operationId: createInvite
      tags:
        - Invites
      summary: Create a new invite
      description: >
        Creates an invite for the authenticated user. Rate-limited per user
        with a token-bucket algorithm (60 tokens per 60 s window by default).
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                required:
                  - data
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      operationId: listInvites
      tags:
        - Invites
      summary: List invites for the authenticated user
      description: >
        Lists invites for the authenticated user. Subject to the same per-user
        token-bucket rate limit as POST /api/invites.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of invites
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                required:
                  - data
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/referrals:
    post:
      operationId: createReferral
      tags:
        - Referrals
      summary: Create a referral code
      description: Creates a new referral code for the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId:
                  type: string
            examples:
              success:
                summary: Create referral request
                value:
                  campaignId: FWC26
      responses:
        '201':
          description: Referral created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      referralCode:
                        type: string
                      message:
                        type: string
                    required:
                      - referralCode
                      - message
                required:
                  - data
              examples:
                success:
                  summary: Referral code created successfully
                  value:
                    data:
                      referralCode: REF-ABC-123
                      message: Referral created successfully
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    get:
      operationId: listReferrals
      tags:
        - Referrals
      summary: List user referrals
      description: Lists all referrals made by the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of referrals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        referredUser:
                          type: string
                        status:
                          type: string
                          enum:
                            - pending
                            - completed
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - referredUser
                        - status
                        - createdAt
                required:
                  - data
              examples:
                success:
                  summary: Referral list
                  value:
                    data:
                      - id: ref-001
                        referredUser: GD2...
                        status: completed
                        createdAt: 2026-07-28T12:00:00Z
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
