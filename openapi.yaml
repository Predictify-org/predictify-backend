        `id` DESC as a stable tie-breaker). Only deliveries that have not yet been dead-lettered are returned here;
        exhausted deliveries appear in the DLQ at `GET /api/admin/webhooks/dlq`. Requires an admin JWT (`role:
        "admin"`).
