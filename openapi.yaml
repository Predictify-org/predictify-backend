openapi: 3.1.0
info:
  title: Predictify API
  version: 0.0.1
  description: Backend API for Predictify — a Stellar/Soroban prediction-markets dApp
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            requestId:
              type: string
          required:
            - code
      required:
        - error
    ValidationErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            details:
              nullable: true
          required:
            - code
      required:
        - error
    DependencyHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
            - down
        correlationId:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ok
                  - degraded
                  - down
              latencyMs:
                type: number
              error:
                type: string
            required:
              - status
      required:
        - status
        - correlationId
        - checkedAt
        - dependencies
    UsersHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        correlationId:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ok
                    - down
                latencyMs:
                  type: number
                error:
                  type: string
              required:
                - status
                - latencyMs
          required:
            - database
      required:
        - status
        - correlationId
        - checkedAt
        - dependencies
    JwkKey:
      type: object
      properties:
        kid:
          type: string
        alg:
          type: string
          enum:
            - HS256
        kty:
          type: string
          enum:
            - oct
        use:
          type: string
          enum:
            - sig
      required:
        - kid
        - alg
        - kty
        - use
    JwksResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JwkKey'
      required:
        - keys
    ChallengeResponse:
      type: object
      properties:
        nonce:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - nonce
        - expiresAt
    ChallengeRequest:
      type: object
      properties:
        stellarAddress:
          type: string
      required:
        - stellarAddress
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
      required:
        - accessToken
        - refreshToken
    VerifyRequest:
      type: object
      properties:
        stellarAddress:
          type: string
        nonce:
          type: string
        signature:
          type: string
      required:
        - stellarAddress
        - nonce
        - signature
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    AuthHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - down
        correlationId:
          type: string
        checkedAt:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ok
                    - down
                latencyMs:
                  type: number
                error:
                  type: string
              required:
                - status
                - latencyMs
          required:
            - database
      required:
        - status
        - correlationId
        - checkedAt
        - dependencies
    Market:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        metadata:
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - question
        - status
        - version
        - createdAt
    MarketSearchResult:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Market'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        page:
          type: integer
        fallback:
          type: boolean
        pagination:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            page:
              type: integer
            total:
              type: integer
            fallback:
              type: boolean
          required:
            - limit
            - offset
            - page
            - total
            - fallback
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            page:
              type: integer
            total:
              type: integer
            fallback:
              type: boolean
          required:
            - limit
            - offset
            - page
            - total
            - fallback
      required:
        - data
        - total
        - limit
        - offset
        - page
        - fallback
        - pagination
        - meta
    PatchMarketRequest:
      type: object
      properties:
        question:
          type: string
        metadata:
          nullable: true
        expectedVersion:
          type: integer
          minimum: 0
      required:
        - expectedVersion
    PredictionCountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            marketId:
              type: string
            count:
              type: integer
              minimum: 0
            computedAt:
              type: string
              format: date-time
            cached:
              type: boolean
          required:
            - marketId
            - count
            - computedAt
            - cached
      required:
        - data
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        stellarAddress:
          type: string
        score:
          type: number
      required:
        - rank
        - stellarAddress
        - score
    AnonRateLimitStatus:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - anonymous
            clientIp:
              type: string
            limit:
              type: integer
            used:
              type: integer
            remaining:
              type: integer
            windowMs:
              type: integer
            resetAt:
              type: string
              format: date-time
          required:
            - type
            - clientIp
            - limit
            - used
            - remaining
            - windowMs
            - resetAt
      required:
        - data
    AuthRateLimitStatus:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
                - authenticated
            limit:
              type: integer
            windowMs:
              type: integer
            bypasses:
              type: boolean
              enum:
                - true
          required:
            - type
            - limit
            - windowMs
            - bypasses
      required:
        - data
    RateLimitAuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - rate_limit.blocked
        walletAddress:
          type: string
          nullable: true
        ip:
          type: string
        correlationId:
          type: string
        rateLimitContext:
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - action
        - walletAddress
        - ip
        - correlationId
        - createdAt
    FeaturedMarket:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        status:
          type: string
        resolutionOutcome:
          type: string
          nullable: true
        resolutionTime:
          type: string
          format: date-time
        winningOutcome:
          type: string
          nullable: true
        metadata:
          nullable: true
        featuredAt:
          type: string
          nullable: true
          format: date-time
        featuredBy:
          type: string
          nullable: true
      required:
        - id
        - question
        - status
        - resolutionTime
        - featuredAt
        - featuredBy
    FeatureMarketResponse:
      type: object
      properties:
        marketId:
          type: string
        featured:
          type: boolean
        featuredAt:
          type: string
          nullable: true
          format: date-time
        featuredBy:
          type: string
          nullable: true
        changed:
          type: boolean
      required:
        - marketId
        - featured
        - featuredAt
        - featuredBy
        - changed
    ForceResolveResponse:
      type: object
      properties:
        marketId:
          type: string
        winningOutcome:
          type: string
        forceResolved:
          type: boolean
          enum:
            - true
      required:
        - marketId
        - winningOutcome
        - forceResolved
    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      required:
        - key
        - enabled
        - description
        - updatedAt
    FeatureFlagListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FeatureFlag'
      required:
        - data
    FeatureFlagResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/FeatureFlag'
      required:
        - data
    CreateFeatureFlagRequest:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 280
      required:
        - key
        - enabled
    UpdateFeatureFlagRequest:
      type: object
      properties:
        enabled:
          type: boolean
        description:
          type: string
          nullable: true
          maxLength: 280
    NotificationCategory:
      type: string
      enum:
        - market_resolved
        - claim_ready
        - dispute_opened
    NotificationChannel:
      type: string
      enum:
        - email
        - webhook
    NotificationPreference:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/NotificationCategory'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        enabled:
          type: boolean
      required:
        - category
        - channel
        - enabled
    NotificationPreferencesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            preferences:
              type: array
              items:
                $ref: '#/components/schemas/NotificationPreference'
          required:
            - preferences
      required:
        - data
    PatchNotificationPreferencesRequest:
      type: object
      properties:
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NotificationPreference'
          minItems: 1
      required:
        - preferences
    MarkNotificationsReadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            updatedCount:
              type: integer
              minimum: 0
          required:
            - updatedCount
      required:
        - data
    NotificationId:
      type: string
      format: uuid
    MarkNotificationsReadRequest:
      type: object
      properties:
        notificationIds:
          type: array
          items:
            $ref: '#/components/schemas/NotificationId'
        markAllAsRead:
          type: boolean
      additionalProperties: false
    UserListRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stellarAddress:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - stellarAddress
        - createdAt
    CurrentUserProfile:
      type: object
      properties:
        stellarAddress:
          type: string
        createdAt:
          type: string
          format: date-time
        totals:
          type: object
          properties:
            prediction_count:
              type: integer
            claim_count:
              type: integer
          required:
            - prediction_count
            - claim_count
      required:
        - stellarAddress
        - createdAt
        - totals
    Prediction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketId:
          type: string
        status:
          type: string
          enum: &ref_0
            - pending
            - confirmed
            - won
            - lost
            - claimed
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - status
        - createdAt
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        stellarAddress:
          type: string
        joinedAt:
          type: string
          format: date-time
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Prediction'
        totals:
          type: object
          properties:
            prediction_count:
              type: integer
            claim_count:
              type: integer
          required:
            - prediction_count
            - claim_count
      required:
        - id
        - stellarAddress
        - joinedAt
        - predictions
        - totals
    PredictionRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        marketId:
          type: string
        question:
          type: string
        outcome:
          type: string
        amount:
          type: string
        txHash:
          type: string
        status:
          type: string
          enum: *ref_0
        result:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resolutionTime:
          type: string
          format: date-time
      required:
        - id
        - marketId
        - question
        - outcome
        - amount
        - txHash
        - status
        - result
        - createdAt
        - resolutionTime
    PredictionsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PredictionRow'
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer
          minimum: 0
      required:
        - items
        - next_cursor
    FollowResult:
      type: object
      properties:
        follower:
          type: string
        followee:
          type: string
        followedAt:
          type: string
          format: date-time
      required:
        - follower
        - followee
        - followedAt
    AdminUserView:
      type: object
      properties:
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
            stellarAddress:
              type: string
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - stellarAddress
            - createdAt
        predictions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              outcome:
                type: string
              amount:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - outcome
              - amount
              - createdAt
        claims:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              amount:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - amount
              - status
              - createdAt
        disputes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              marketId:
                type: string
              reason:
                type: string
              status:
                type: string
              createdAt:
                type: string
                format: date-time
            required:
              - id
              - marketId
              - reason
              - status
              - createdAt
        totals:
          type: object
          properties:
            predictions:
              type: integer
            claims:
              type: integer
            disputes:
              type: integer
          required:
            - predictions
            - claims
            - disputes
      required:
        - user
        - predictions
        - claims
        - disputes
        - totals
    AuditEntry:
      type: object
      description: >
        A single audit log entry. Entries are always returned ordered by
        `created_at DESC, id DESC`. The `(created_at, id)` pair forms the
        composite keyset cursor key — both fields are present in every entry.
      properties:
        id:
          type: string
          format: uuid
          description: >
            Unique entry identifier (UUID). Acts as the tie-breaker in the
            keyset cursor when multiple entries share the same `createdAt`
            timestamp (common under concurrent writes).
        action:
          type: string
        actor:
          type: string
        targetAddress:
          type: string
        createdAt:
          type: string
          format: date-time
          description: >
            ISO 8601 timestamp of when the event was recorded. Primary sort
            key for cursor pagination (DESC). Sub-millisecond precision is
            preserved in the cursor encoding.
      required:
        - id
        - action
        - createdAt
    AuditActionCount:
      type: object
      properties:
        action:
          type: string
        count:
          type: integer
      required:
        - action
        - count
    AuditCountsSummary:
      type: object
      properties:
        totalCount:
          type: integer
        byAction:
          type: array
          items:
            $ref: '#/components/schemas/AuditActionCount'
      required:
        - totalCount
        - byAction
    PluginView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        config:
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - enabled
        - createdAt
        - updatedAt
    CreatePluginRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties:
            nullable: true
      required:
        - name
    UpdatePluginRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 1000
        enabled:
          type: boolean
        config:
          type: object
          additionalProperties:
            nullable: true
    DeletePluginResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
    AdminRateLimitInspect:
      type: object
      properties:
        address:
          type: string
          description: Target Stellar address
        limit:
          type: integer
          description: Configured request cap in the window
        used:
          type: integer
          description: Requests currently active in the window
        remaining:
          type: integer
          description: Requests remaining in the current window
        windowMs:
          type: integer
          description: Sliding-window length in milliseconds
        resetAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp when the window resets
      required:
        - address
        - limit
        - used
        - remaining
        - windowMs
        - resetAt
    CheckStatus:
      type: string
      enum:
        - ok
        - degraded
        - error
    DbPoolStats:
      type: object
      properties:
        total:
          type: integer
          description: Total connections in pool
        idle:
          type: integer
          description: Idle (available) connections
        waiting:
          type: integer
          description: Clients waiting for a connection
      required:
        - total
        - idle
        - waiting
    DbPoolCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        stats:
          $ref: '#/components/schemas/DbPoolStats'
        error:
          type: string
      required:
        - status
        - latencyMs
        - stats
    IndexerCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        lastIndexedLedger:
          type: integer
          nullable: true
        chainTip:
          type: integer
          nullable: true
        lagLedgers:
          type: integer
          nullable: true
        error:
          type: string
      required:
        - status
        - latencyMs
        - lastIndexedLedger
        - chainTip
        - lagLedgers
    RpcCheck:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CheckStatus'
        latencyMs:
          type: integer
        latestLedger:
          type: integer
          nullable: true
        error:
          type: string
      required:
        - status
        - latencyMs
        - latestLedger
    AdminHealthDetail:
      type: object
      properties:
        dbPool:
          $ref: '#/components/schemas/DbPoolCheck'
        indexer:
          $ref: '#/components/schemas/IndexerCheck'
        rpc:
          $ref: '#/components/schemas/RpcCheck'
        checkedAt:
          type: string
          format: date-time
      required:
        - dbPool
        - indexer
        - rpc
        - checkedAt
    ReconciliationSidePosition:
      type: object
      properties:
        stellarAddress:
          type: string
        outcome:
          type: string
        amount:
          type: string
      required:
        - stellarAddress
        - outcome
        - amount
    ReconciliationSummary:
      type: object
      properties:
        totalKeys:
          type: integer
        matches:
          type: integer
        mismatches:
          type: integer
        missingOnChain:
          type: integer
        missingInDb:
          type: integer
      required:
        - totalKeys
        - matches
        - mismatches
        - missingOnChain
        - missingInDb
    ReconciliationDiffEntry:
      type: object
      properties:
        key:
          type: object
          properties:
            stellarAddress:
              type: string
            outcome:
              type: string
          required:
            - stellarAddress
            - outcome
        dbAmount:
          type: string
        onChainAmount:
          type: string
          nullable: true
        difference:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - match
            - mismatch
            - missing_on_chain
            - missing_in_db
      required:
        - key
        - dbAmount
        - onChainAmount
        - difference
        - status
    MarketReconciliationResult:
      type: object
      properties:
        marketId:
          type: string
        correlationId:
          type: string
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - ok
            - partial
        dbSnapshot:
          type: object
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/ReconciliationSidePosition'
            totalAmount:
              type: string
          required:
            - positions
            - totalAmount
        onChainSnapshot:
          type: object
          properties:
            positions:
              type: array
              items:
                $ref: '#/components/schemas/ReconciliationSidePosition'
            totalAmount:
              type: string
            available:
              type: boolean
            source:
              type: string
            unavailableReason:
              type: string
              nullable: true
          required:
            - positions
            - totalAmount
            - available
            - source
            - unavailableReason
        summary:
          $ref: '#/components/schemas/ReconciliationSummary'
        diffs:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationDiffEntry'
      required:
        - marketId
        - correlationId
        - generatedAt
        - status
        - dbSnapshot
        - onChainSnapshot
        - summary
        - diffs
    DeliveryStatus:
      type: string
      enum:
        - pending
        - delivered
        - failed
      description: Current delivery state of a webhook attempt
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique delivery ID
        eventId:
          type: string
          description: Opaque event identifier supplied by the emitting service
        eventType:
          type: string
          description: Event type string, e.g. "market.resolved" or "dispute.opened"
        targetUrl:
          type: string
          format: uri
          description: The subscriber endpoint the delivery is sent to
        payloadBase64:
          type: string
          description: Base64-encoded signed request body
        signature:
          type: string
          description: HMAC-SHA256 signature over the payload, sent as a request header
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Extra HTTP headers sent with the delivery (may be null)
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        attempts:
          type: integer
          minimum: 0
          description: Number of delivery attempts made so far
        maxAttempts:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: Maximum attempts before the delivery is dead-lettered
        lastError:
          type: string
          nullable: true
          description: Error message from the most recent failed attempt, or null
        nextAttemptAt:
          type: string
          nullable: true
          format: date-time
          description: ISO 8601 timestamp of the next scheduled retry, or null when terminal
        createdAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when this delivery record was created
        updatedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the most recent status change
      required:
        - id
        - eventId
        - eventType
        - targetUrl
        - payloadBase64
        - signature
        - headers
        - status
        - attempts
        - maxAttempts
        - lastError
        - nextAttemptAt
        - createdAt
        - updatedAt
    DlqRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: DLQ row ID (distinct from the original delivery ID)
        originalId:
          type: string
          format: uuid
          description: ID of the original live delivery that was dead-lettered
        eventId:
          type: string
          description: Opaque event identifier from the original delivery
        eventType:
          type: string
          description: Event type string from the original delivery
        targetUrl:
          type: string
          format: uri
          description: Subscriber endpoint that failed to receive the delivery
        payloadBase64:
          type: string
          description: Base64-encoded signed request body, identical to the original delivery
        signature:
          type: string
          description: HMAC-SHA256 signature from the original delivery
        headers:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Extra HTTP headers from the original delivery (may be null)
        attempts:
          type: integer
          minimum: 0
          description: Total number of delivery attempts before dead-lettering
        maxAttempts:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          description: Configured maximum attempts for the original delivery
        lastError:
          type: string
          description: Error message from the final failed attempt
        failedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the delivery was moved to the DLQ
        replayedAt:
          type: string
          nullable: true
          format: date-time
          description: ISO 8601 timestamp of the replay request, or null if not yet replayed
        replayDeliveryId:
          type: string
          nullable: true
          format: uuid
          description: ID of the fresh live delivery created by replay, or null if not yet replayed
      required:
        - id
        - originalId
        - eventId
        - eventType
        - targetUrl
        - payloadBase64
        - signature
        - headers
        - attempts
        - maxAttempts
        - lastError
        - failedAt
        - replayedAt
        - replayDeliveryId
    FingerprintResponse:
      type: object
      properties:
        fingerprint:
          type: string
          description: 64-character hex SHA-256 fingerprint of the request structure
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        correlationId:
          type: string
          description: Correlation ID for distributed tracing
        method:
          type: string
          description: HTTP method of the request
        path:
          type: string
          description: Normalised path of the request (excludes query string)
        computedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the fingerprint was computed
      required:
        - fingerprint
        - correlationId
        - method
        - path
        - computedAt
  parameters: {}
paths:
  /api/comments:
    get:
      tags:
        - Comments
      summary: List all comments
      description: Root comments endpoint for listing comments securely.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            maximum: 100
            minimum: 1
          required: false
        - in: query
          name: cursor
          schema:
            type: string
          required: false
      responses:
        '200':
          description: A list of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  nextCursor:
                    type: string
                    nullable: true
                  message:
                    type: string
              examples:
                Success:
                  summary: Example successful response
                  value:
                    data: []
                    nextCursor: null
                    message: "Comments fetched securely"
    post:
      tags:
        - Comments
      summary: Create a new comment
      description: Creates a new comment and optionally dispatches an outbound call propagating X-Correlation-Id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                marketId:
                  type: string
                body:
                  type: string
                  maxLength: 2000
                authorAddress:
                  type: string
                outboundUrl:
                  type: string
                  format: uri
              required:
                - marketId
                - body
            examples:
              CreateCommentExample:
                summary: Example create comment request
                value:
                  marketId: "market-123"
                  body: "This market has an interesting prediction."
                  authorAddress: "GBX..."
                  outboundUrl: "https://webhook.site/abc"
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      marketId:
                        type: string
                      body:
                        type: string
                      authorAddress:
                        type: string
                        nullable: true
                      createdAt:
                        type: string
                        format: date-time
                  message:
                    type: string
              examples:
                SuccessExample:
                  summary: Example successful creation
                  value:
                    data:
                      id: "c-1678886400000"
                      marketId: "market-123"
                      body: "This market has an interesting prediction."
                      authorAddress: "GBX..."
                      createdAt: "2023-03-15T12:00:00.000Z"
                    message: "Comment created successfully"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorBody'
  /health:
