                        headers: null
                        status: delivered
                        attempts: 1
                        maxAttempts: 5
                        lastError: null
                        nextAttemptAt: null
                        createdAt: '2026-07-25T12:00:00.000Z'
                        updatedAt: '2026-07-25T12:00:05.000Z'
                      - id: d1a2b3c4-0002-4000-8000-000000000002
